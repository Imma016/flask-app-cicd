---
- name: Setup Python and Flask
  hosts: app_servers
  become: yes
  tasks:
    - name: Install Python and dependencies
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - python3
        - python3-pip
        - python3-venv

    - name: Install Flask
      pip:
        name: flask
        state: present

- name: Setup PostgreSQL
  hosts: database
  become: yes
  tasks:
    - name: Install PostgreSQL
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - postgresql
        - postgresql-contrib

    - name: Start PostgreSQL service
      service:
        name: postgresql
        state: started
        enabled: yes

- name: Deploy Flask App
  hosts: g1
  become: yes
  tasks:
    - name: Ensure app directory exists
      file:
        path: /opt/flask-app
        state: directory
        mode: '0755'

    - name: Copy application files
      copy:
        src: "{{ playbook_dir }}/files/app/"
        dest: /opt/flask-app

